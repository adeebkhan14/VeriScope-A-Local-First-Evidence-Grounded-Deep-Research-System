services:
  backend:
    depends_on:
      ollama-bridge:
        condition: service_healthy

  ollama-bridge:
    build:
      context: ./backend
    image: veriscope-backend:local
    command: ["node", "src/ollamaBridge.js"]
    network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BRIDGE_BIND_HOST: host.docker.internal
      OLLAMA_BRIDGE_PORT: "11434"
      OLLAMA_BRIDGE_UPSTREAM_HOST: 127.0.0.1
      OLLAMA_BRIDGE_UPSTREAM_PORT: "11434"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://host.docker.internal:11434/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
